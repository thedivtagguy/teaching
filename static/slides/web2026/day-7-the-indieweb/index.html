    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## What kind of room is a website?

This is Laurel Schwulst's question(cardboard box lady from Day 2) , and I think it is the best question anyone has asked about personal websites.

<!-- Add screenshot of the essay header: https://thecreativeindependent.com/essays/laurel-schwulst-my-website-is-a-shifting-house-next-to-a-river-of-knowledge-what-could-yours-be/ -->

In her essay, her website is a **shifting house next to a river of knowledge**.

The website is a _place_.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

A website can also be, she suggests:

- a **room** you rearrange for different occasions
- a **shelf** holding a few careful things
- a **plant** that grows slowly if you water it
- a **puddle** that reflects whoever looks into it


None of these are "personal brand" <!-- .element: class="fragment" -->
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### On the platforms, no one is looking out for you but you

Schwulst points out that the anxiety you feel on social media is not a personal failing. These are companies that prioritise advertisers over you. Feeling weird there is the correct response.

<br></br>

A personal website is where you get to _set the record straight_ on who you are.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

## Own Your Data

Plant your content into the field of your own website. When you migrate to a new host (Netlify) or CMS (something like Wordpress), if your site stays on the same domain, everyone will still find you.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

If you design for some hypothetical user, they may not actually exist; if you make for yourself, you actually do exist.

- A website for each of your course modules?
- A set of pages to document your learning a new tool?

</div>

<aside class="notes"><p>You’re freed from the pressure to get everything right immediately. You can test ideas, get feedback, and revise your opinions like a good internet citizen. It’s <em>low friction</em>. Gardening your thoughts becomes a daily ritual that only takes a small amount of effort. Over time, big things grow. It gives readers an insight into your writing and thinking process. They come to realise you are not a magical idea machine banging out perfectly formed thoughts, but instead an equally mediocre human doing The Work of trying to understand the world and make sense of it alongside you.</p>

### Imperfection & Learning in Public

Putting anything imperfect and half-written on an “official website” may feel strange.

<br></br>

We have all been trained to behave like tiny, performative corporations when it comes to presenting ourselves in digital space.
</div>

<aside class="notes"><p>Digital gardening is the <a href="https://www.ribbonfarm.com/series/domestic-cozy/">Domestic Cozy</a> response to the professional personal blog; it’s both intimate and public, weird and welcoming. It’s less performative than a blog, but more intentional and thoughtful than a Twitter feed. It wants to build personal knowledge over time, rather than engage in banter and quippy conversations.</p>

### Field notes
 
For one blog that you liked, answer these questions in your dev notes.
 
- What does this person assume you already know?
- Where is the newest thing on the site? How did you find it?
- Where is the oldest thing? Did the author keep it, change it, or hide it? If nothing on the site has a date, that is also an answer.
- What is the smallest thing the author published? How long would it take you to make one of those?
- Which navigation choice would no template make?
- Where do you hear the author's voice most clearly?
- **What would break if this site had to live on Instagram?**
- Steal one idea.

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
