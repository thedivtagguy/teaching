[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  # Raise Node's heap ceiling; function bundling was OOMing at the ~2 GB default.
  NODE_OPTIONS = "--max-old-space-size=6144"

[functions]
  included_files = ["!static/**"]

# Redirects live in _redirects at the repo root — adapter-netlify rejects
# [[redirects]] in this file.

